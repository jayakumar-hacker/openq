<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Doctors')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <h1>Our doctors</h1>
    <p th:if="${#lists.isEmpty(cards)}" class="empty">No doctors are available right now. Please check back later.</p>
    <div class="grid" th:unless="${#lists.isEmpty(cards)}">
        <article class="card" th:each="card : ${cards}">
            <h2 th:text="${card.doctor.name}">Dr. Name</h2>
            <p class="tag" th:text="${card.doctor.specialization}">Specialization</p>
            <p class="muted" th:if="${card.doctor.qualification != null}" th:text="${card.doctor.qualification}">Qualification</p>
            <p class="muted" th:text="${card.doctor.clinicName}">Clinic</p>
            <p>
                <strong th:text="${card.availableSlots}">0</strong>
                <span th:text="${card.availableSlots == 1} ? 'open slot' : 'open slots'">open slots</span>
            </p>
            <a class="btn" th:href="@{/doctors/{id}/slots(id=${card.doctor.id})}"
               th:attr="aria-label='View available slots for ' + ${card.doctor.name}">View slots</a>
        </article>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
