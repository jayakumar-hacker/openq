# =====================================================================
# OpenQ configuration
# Every value that differs between your laptop and Azure is read from an
# environment variable, with a safe local default where one makes sense.
# =====================================================================
spring.application.name=openq

# --- HTTP port -------------------------------------------------------
# Azure App Service (Linux, Java SE) passes the port to listen on in the PORT
# environment variable. Locally PORT is normally unset, so we fall back to 8080.
server.port=${PORT:8080}
# Finish in-flight requests on shutdown/restart instead of cutting them off.
server.shutdown=graceful

# --- Database (PostgreSQL) -------------------------------------------
# DB_URL / DB_USERNAME / DB_PASSWORD come from the environment.
# There is deliberately NO default password: a missing DB_PASSWORD fails fast at startup.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/openq}
spring.datasource.username=${DB_USERNAME:openq}
spring.datasource.password=${DB_PASSWORD:}

# Small connection pool for a small host and a small database server.
# Each in-flight booking holds one connection, so 5 is plenty for a demo.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Fail a request after 10 s instead of waiting forever for a free connection.
spring.datasource.hikari.connection-timeout=10000
# Recycle connections before Azure's idle-connection cleanup can silently drop them.
spring.datasource.hikari.max-lifetime=600000
# If a row lock (SELECT ... FOR UPDATE on the slot) is held for more than 5 s, give up
# with an error instead of hanging the request. The app turns this into a "please retry" page.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'

# --- Schema and seed-data initialisation -----------------------------
# 1) Spring runs schema.sql then data.sql on every start (mode=always) because the
#    database is an external PostgreSQL server, not an embedded one.
# 2) Both scripts are idempotent (CREATE ... IF NOT EXISTS, INSERT ... ON CONFLICT DO NOTHING),
#    so restarting never duplicates rows.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false
# schema.sql runs BEFORE Hibernate starts (this is the default; stated here on purpose).
spring.jpa.defer-datasource-initialization=false

# --- JPA / Hibernate -------------------------------------------------
# schema.sql OWNS the schema (including the partial unique index that JPA cannot express).
# Hibernate must never generate DDL; "validate" makes startup fail loudly if an entity
# no longer matches a table, instead of silently drifting.
spring.jpa.hibernate.ddl-auto=validate
# Do not keep a database connection open while a Thymeleaf page renders.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Thymeleaf -------------------------------------------------------
spring.thymeleaf.cache=true

# --- Error handling: never leak internals to browsers ----------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- OpenQ settings --------------------------------------------------
# Clinic-local timezone. All slot times are stored as local wall-clock time (TIMESTAMP, no zone)
# in this zone. data.sql uses the same zone name when it generates future slots.
openq.clinic-zone=${OPENQ_CLINIC_ZONE:Asia/Kolkata}

# --- Logging ---------------------------------------------------------
logging.level.root=INFO
logging.level.com.openq=INFO
# Keep SQL (which would contain patient data as bind values) out of the logs.
logging.level.org.hibernate.SQL=WARN
