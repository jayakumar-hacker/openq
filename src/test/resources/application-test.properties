# Used by the *IT integration tests (@ActiveProfiles("test")). Needs a REAL PostgreSQL database.
# Use a separate throwaway database: the tests insert their own doctors/slots/appointments.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/openq_test}
spring.datasource.username=${TEST_DB_USERNAME:openq}
spring.datasource.password=${TEST_DB_PASSWORD:}
# Enough connections for the concurrent-booking test (threads wait on the slot row lock).
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=20000
